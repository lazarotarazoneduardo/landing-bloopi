<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>6 years with u</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#20122B">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2320122B'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='%23FFB48A' stroke-width='2.5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@1,6..96,400;1,6..96,500&family=Hanken+Grotesk:wght@400;500;600&display=swap">
<style>
  :root {
    --noche: #20122B;
    --ciruela: #36204A;
    --albaricoque: #FFB48A;
    --rosa-te: #F7D9D0;
    --lila: #A892C2;
    --chispa: #FFE9A8;
    --display: "Bodoni Moda", "Bodoni 72", Didot, "Times New Roman", serif;
    --texto: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--noche);
    color: var(--rosa-te);
    font-family: var(--texto);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  .escena {
    position: relative;
    isolation: isolate;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(28px, 6dvh, 56px);
    padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
  }
  /* La noche, y la luz que entra por abajo cuando dan las doce */
  .escena::before,
  .escena::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    pointer-events: none;
  }
  .escena::before {
    background:
      radial-gradient(90% 55% at 50% -8%, #2F1B42 0%, transparent 70%),
      radial-gradient(120% 70% at 50% 112%, var(--ciruela) 0%, transparent 62%);
  }
  .escena::after {
    background: radial-gradient(130% 75% at 50% 118%, rgba(255, 180, 138, .34) 0%, rgba(255, 180, 138, .08) 42%, transparent 66%);
    opacity: 0;
    transition: opacity 2.6s ease;
  }
  [data-estado="abierto"].escena::after { opacity: 1; }

  .iniciales {
    font-family: var(--display);
    font-style: italic;
    font-size: clamp(1.7rem, 8vw, 2.2rem);
    line-height: 1;
    letter-spacing: .06em;
  }
  .iniciales i {
    font-size: .72em;
    vertical-align: .1em;
    color: var(--albaricoque);
    padding: 0 .12em;
  }

  /* Anillo de seis tramos: uno por año */
  .anillo {
    position: relative;
    width: min(84vw, 58dvh, 430px);
    aspect-ratio: 1;
    container-type: inline-size;
  }
  .anillo svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: visible;
  }
  .tramo {
    fill: none;
    stroke-width: 3;
    stroke-linecap: round;
  }
  .tramo--fondo { stroke: rgba(168, 146, 194, .22); }
  .tramo--luz {
    stroke: var(--albaricoque);
    filter: drop-shadow(0 0 5px rgba(255, 180, 138, .55));
  }
  .tramo--sexto { animation: latido 2.4s ease-in-out infinite; }
  [data-estado="abierto"] .tramo--sexto { animation: none; }
  @keyframes latido {
    50% { stroke: var(--chispa); }
  }
  .recien .anillo svg { animation: destello 1.6s cubic-bezier(.2, .7, .2, 1); }
  @keyframes destello {
    0% { transform: scale(1); filter: brightness(1); }
    28% { transform: scale(1.045); filter: brightness(1.5) drop-shadow(0 0 22px rgba(255, 233, 168, .6)); }
    100% { transform: scale(1); filter: brightness(1); }
  }

  .centro {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
  }
  .centro > * { grid-area: 1 / 1; }

  .cuenta {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3.2cqi;
  }
  .rotulo {
    font-size: max(11px, 3.3cqi);
    font-weight: 500;
    letter-spacing: .3em;
    text-indent: .3em;
    text-transform: uppercase;
    color: var(--lila);
  }
  .digitos {
    display: flex;
    font-family: var(--display);
    font-style: italic;
    font-weight: 400;
    font-size: 17cqi;
    line-height: 1;
    font-variant-numeric: lining-nums tabular-nums;
  }
  .digitos .d { width: .6em; text-align: center; }
  .digitos .sep { width: .3em; text-align: center; color: var(--albaricoque); }

  .fecha {
    font-family: var(--display);
    font-style: italic;
    font-weight: 400;
    font-size: 24cqi;
    line-height: 1;
    font-variant-numeric: lining-nums;
  }
  .fecha--larga { font-size: 13.5cqi; }
  .fecha i { color: var(--albaricoque); padding: 0 .04em; }

  .bajo {
    display: grid;
    justify-items: center;
    width: min(100%, 30rem);
    min-height: 10.5rem;
    text-align: center;
  }
  .bajo > * { grid-area: 1 / 1; }
  .pie {
    font-size: 1rem;
    letter-spacing: .02em;
    color: var(--lila);
  }
  .mensaje {
    font-family: var(--display);
    font-style: italic;
    font-size: clamp(1.3rem, 5.6vw, 1.6rem);
    line-height: 1.32;
    text-wrap: balance;
  }
  .boton {
    margin-top: 1.6rem;
    padding: .95rem 1.9rem;
    border: 0;
    border-radius: 999px;
    background: var(--albaricoque);
    color: var(--noche);
    font: 600 1rem/1 var(--texto);
    letter-spacing: .01em;
    cursor: pointer;
    transition: background .2s ease, transform .2s ease;
  }
  .boton:hover { background: var(--chispa); }
  .boton:active { transform: scale(.97); }
  .boton:focus-visible { outline: 2px solid var(--chispa); outline-offset: 4px; }
  .pronto {
    margin-top: 1.4rem;
    font-size: .95rem;
    color: var(--lila);
  }

  /* Qué se ve en cada estado */
  .cuenta, .pie, .fecha, .apertura > * {
    transition: opacity .7s ease, transform .9s cubic-bezier(.2, .7, .2, 1), visibility 0s linear 0s;
  }
  [data-estado="cuenta"] .fecha,
  [data-estado="cuenta"] .apertura > * {
    opacity: 0;
    visibility: hidden;
    transform: translateY(14px);
  }
  [data-estado="abierto"] .cuenta,
  [data-estado="abierto"] .pie {
    opacity: 0;
    visibility: hidden;
    transition: opacity .4s ease, visibility 0s linear .4s;
  }
  [data-estado="abierto"] .fecha { transition-delay: .45s; }
  [data-estado="abierto"] .mensaje { transition-delay: 1.2s; }
  [data-estado="abierto"] .mensaje ~ * { transition-delay: 1.9s; }

  [hidden] { display: none !important; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation: none !important;
      transition-duration: .01s !important;
      transition-delay: 0s !important;
    }
  }
</style>
</head>
<body>
<main class="escena" data-estado="cuenta">
  <p class="iniciales">P <i>y</i> E</p>
  <div class="anillo">
    <svg viewBox="0 0 200 200" aria-hidden="true"></svg>
    <div class="centro">
      <div class="cuenta" role="timer" aria-label="Tiempo que falta">
        <span class="rotulo">faltan</span>
        <div class="digitos"></div>
        <span class="rotulo">horas · min · seg</span>
      </div>
      <p class="fecha"></p>
    </div>
  </div>

  <div class="bajo">
    <p class="pie">Algo empieza a las 00:00.</p>
    <div class="apertura" aria-live="polite">
      <p class="mensaje"></p>
      <button class="boton" type="button" hidden>Empezar el examen</button>
      <p class="pronto" hidden></p>
    </div>
  </div>
</main>

<script>
  // ---- Lo que se puede cambiar sin tocar nada más ----
  const APERTURA = '2026-10-02T00:00:00+02:00';   // medianoche de hoy, hora peninsular
  const FECHA = '02/04/2026';
  const MENSAJE = 'Para ir a la cena de mañana tendrás que pasar un pequeño examen.';
  const EXAMEN_LISTO = false;                      // true cuando estén las preguntas
  const AVISO_SIN_EXAMEN = 'El examen aparecerá aquí mismo.';
  const VENTANA_SEXTO = 2 * 60 * 60 * 1000;        // el sexto tramo se llena en las dos últimas horas

  const escena = document.querySelector('.escena');
  const svg = document.querySelector('.anillo svg');
  const digitos = document.querySelector('.digitos');

  // Solo en local: ?ensayo=10 abre a los 10 segundos y ?ensayo=0 entra ya abierta.
  // Publicada, la cuenta atrás es siempre la real.
  const enLocal = location.protocol === 'file:' || location.hostname === 'localhost';
  const params = new URLSearchParams(location.search);
  const objetivo = enLocal && params.has('ensayo')
    ? Date.now() + (Number(params.get('ensayo')) || 0) * 1000
    : Date.parse(APERTURA);

  // Textos de la apertura
  const fecha = document.querySelector('.fecha');
  fecha.innerHTML = FECHA.split('/').join('<i>/</i>');
  fecha.classList.toggle('fecha--larga', FECHA.length > 5);
  document.querySelector('.mensaje').textContent = MENSAJE;
  if (EXAMEN_LISTO) {
    document.querySelector('.boton').hidden = false;
  } else {
    const pronto = document.querySelector('.pronto');
    pronto.textContent = AVISO_SIN_EXAMEN;
    pronto.hidden = false;
  }

  // Anillo: seis tramos, cinco encendidos y el sexto llenándose
  const NS = 'http://www.w3.org/2000/svg';
  const R = 92, C = 2 * Math.PI * R, HUECO = 14, SEG = C / 6 - HUECO;
  let sexto;
  for (let i = 0; i < 6; i++) {
    for (const capa of ['fondo', 'luz']) {
      const c = document.createElementNS(NS, 'circle');
      c.setAttribute('cx', 100); c.setAttribute('cy', 100); c.setAttribute('r', R);
      c.setAttribute('class', `tramo tramo--${capa}`);
      c.setAttribute('stroke-dasharray', `${SEG} ${C}`);
      c.setAttribute('transform', `rotate(${-90 + i * 60 + (HUECO / 2 / C) * 360} 100 100)`);
      svg.appendChild(c);
      if (capa === 'luz' && i === 5) { sexto = c; c.classList.add('tramo--sexto'); }
    }
  }

  // Si el reloj del móvil va mal, nos fiamos de la hora del servidor
  let desfase = 0;
  fetch(location.pathname, { method: 'HEAD', cache: 'no-store' })
    .then((r) => {
      const hora = Date.parse(r.headers.get('date') || '');
      if (!Number.isNaN(hora) && Math.abs(hora + 500 - Date.now()) > 5000) desfase = hora + 500 - Date.now();
    })
    .catch(() => {});

  const dos = (n) => String(n).padStart(2, '0');

  function pintar(falta) {
    const s = Math.ceil(falta / 1000);
    const texto = `${dos(Math.floor(s / 3600))}:${dos(Math.floor(s / 60) % 60)}:${dos(s % 60)}`;
    if (digitos.children.length !== texto.length) {
      digitos.replaceChildren(...[...texto].map((ch) => {
        const span = document.createElement('span');
        span.className = ch === ':' ? 'sep' : 'd';
        return span;
      }));
    }
    [...texto].forEach((ch, i) => {
      if (digitos.children[i].textContent !== ch) digitos.children[i].textContent = ch;
    });
    const p = Math.min(1, Math.max(0, 1 - falta / VENTANA_SEXTO));
    sexto.setAttribute('stroke-dasharray', `${Math.max(.01, SEG * p)} ${C}`);
  }

  function abrir(enDirecto) {
    clearInterval(reloj);
    sexto.setAttribute('stroke-dasharray', `${SEG} ${C}`);
    if (enDirecto) escena.classList.add('recien');
    escena.dataset.estado = 'abierto';
  }

  function tic() {
    const falta = objetivo - (Date.now() + desfase);
    if (falta <= 0) return abrir(true);
    pintar(falta);
  }

  let reloj;
  if (objetivo - Date.now() <= 0) {
    abrir(false);
  } else {
    tic();
    reloj = setInterval(tic, 250);
  }
</script>
</body>
</html>
